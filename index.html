<!DOCTYPE html>
<html>
<head>
<style>
.button {
  background-color: white;
  border: none;
  color: black;
  padding: 16px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  transition-duration: 0.4s;
  cursor: pointer;
}


.button1 {border: 2px solid #04AA6D;}
.button1 {cursor: default;}

.button2 {border: 2px solid #008CBA;}
.button3 {border: 2px solid #f44336;}
.button4 {border: 2px solid #e7e7e7;}
.button5 {border: 2px solid #555555;}

.button1:hover {
  background-color: #00000000;
  border-color: #00000000;
  color: white;
}

.button2:hover {
  background-color: #008CBA;
  color: white;
}

.button3:hover {
  background-color: #f44336;
  color: white;
}

.button4:hover {background-color: #e7e7e7;}

.button5:hover {
  background-color: #555555;
  color: white;
}
</style>
</head>
<body>
<div style="border: 2px solid black; padding: 10px; background-color: pink">
<h2 style="text-align: center;">Will you be my valentine?</h2>
</div>

<p style="color: red;">Roses are red</p>
<p style="color: blue;">Violets are blue</p>
<p style="color: brown;">You are stinky</p>
<p style="color: pink;">But I still love you!</p>

<button class="button button1">No</button>
<button class="button button2">Yes</button>

</body>
</html>
